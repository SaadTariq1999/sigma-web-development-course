<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* The specification of this selector is 1 */
        h1 {
            color: aqua;
        }

        /* The specification of this selector is 10 */
        .yellow {
            color: yellow;
        }

        /* The specification of this selector is 10 */
        .cred {
            color: red;
        }

        /* The specification of this selector is 10 */
        .cpurple {
            color: purple;
        }

        /* The specification of this selector is 10 */
        [data-x=a] {
            color: maroon;
        }

        /* The specification of this selector is 1+10+10+10+10=41  */
        a.harryclass.rohan-class[href]:hover{
            color: blueviolet;
        }
    </style>
</head>

<body>
    <div>
        <h1 class="yellow cred cpurple" data-x="a">CSS Specification</h1>
    </div>
</body>

</html>
