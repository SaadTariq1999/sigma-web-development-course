<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 3 solution</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Baloo+Bhai+2&family=Poppins:wght@300&display=swap');

        *{
            padding: 0;
            margin: 0;
        }

        body {
            background-color: gray;
            padding: 40px;
        }

        .card {
            background-color: #fff;
            width: 198px;
            padding: 0 0 20px 0;
            border-radius: 7px;
        }

        .image{
            padding: 5px;
        }

        .image img{
            border-radius: 7px;
        }

        .capsules{
            padding: 0 0 0 20px;

        }

        .capsules span{
            border: 2px solid rgb(215, 208, 208);
            border-radius: 10px;
            background-color: gainsboro;
            padding: 2px 10px;
            font-size: 10px;
        }

        .content{
            padding: 20px 4px 4px 4px;
        }

        .content button{
            margin-top: 10px;
            padding: 2px 4px;
            font-size: 10px;
        }

        .content p{
            margin-top: 10px;
            font-size: 12px;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="image">
            <img  width="188"src="https://images.pexels.com/photos/3880179/pexels-photo-3880179.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1" alt="" alt="">
        </div>

        <div class="capsules">
            <span>Nature</span>
            <span>Lake</span>
        </div>

        <div class="content">
            <h2>Saad</h2>
            <p>Lorem, ipsum dolor sit amet consectetur adipisicing elit. Odit fuga quaerat mollitia similique expedita impedit exercitationem at aliquam quisquam voluptate! Hic, sunt dolores?</p>
            <button>Read More</button>
        </div>
    </div>
</body>

</html>
